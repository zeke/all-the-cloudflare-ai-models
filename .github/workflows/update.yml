name: Update catalog
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
concurrency:
  group: catalog-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run update
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test
      - name: Commit changed catalog data
        run: |
          if git diff --quiet -- index.json sources.json CHANGELOG.md; then
            echo 'Catalog unchanged; no commit or version change.' >> "$GITHUB_STEP_SUMMARY"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.json sources.json CHANGELOG.md
            git commit -m 'chore: update Cloudflare model catalog'
            git push origin HEAD:main
            echo 'Updated catalog and changelog committed to main.' >> "$GITHUB_STEP_SUMMARY"
          fi
